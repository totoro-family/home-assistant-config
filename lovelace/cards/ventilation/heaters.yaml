type: vertical-stack
title: Heaters (last 3 days)
cards:
  - type: custom:mini-graph-card
    name: Dining room
    hours_to_show: 72
    points_per_hour: .25
    line_width: 3
    entities:
      - entity: sensor.dining_room_heat_per_hour
        name: Heating
        show_state: false
      - entity: number.dining_room_heater_valve_position
        name: Valve position
        show_state: false
        y_axis: secondary
