substitutions:
  name: "makita-aws-adapter"
  friendly_name: "Makita AWS adapter"
  update_bl0942: 5s
  max_power: "1500"
  max_temp: "60.0"
packages: { device-base: !include common/device-base.yaml }
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

esp32_ble_tracker:
  scan_parameters:
    interval: 100ms
    window: 80ms
  on_ble_advertise:
    - then:
        - lambda: |-
            // ESP_LOGD("makita_aws", "New BLE device");
            // ESP_LOGD("makita_aws", "  address: %s", x.address_str().c_str());
            // ESP_LOGD("makita_aws", "  name: %s", x.get_name().c_str());
            // ESP_LOGD("makita_aws", "  Advertised service UUIDs:");
            // for (auto uuid : x.get_service_uuids()) {
            //     ESP_LOGD("makita_aws", "    - %s", uuid.to_string().c_str());
            // }
            // ESP_LOGD("makita_aws", "  Advertised service data:");
            // for (auto data : x.get_service_datas()) {
            //     ESP_LOGD("makita_aws", "    - %s: (length %i)", data.uuid.to_string().c_str(), data.data.size());
            // }
            // ESP_LOGD("makita_aws", "  Advertised manufacturer data:");
            // for (auto data : x.get_manufacturer_datas()) {
            //     ESP_LOGD("makita_aws", "    - %s: (length %i)", data.uuid.to_string().c_str(), data.data.size());
            // }
            // for (int i = 0; i < x.get_scan_result().scan_rsp_len + x.get_scan_result().adv_data_len; i++) {
            //     ESP_LOGD("makita_aws", "%02x ", x.get_scan_result().ble_adv[i]);
            // }

            const uint8_t offset = 3;

            const uint8_t poweron[6]     = { 0x05, 0xff, 0xfc, 0x33, 0x03, 0x05 };
            const uint8_t initialised[6] = { 0x05, 0xff, 0xfd, 0x33, 0x06, 0x06 };
            const uint8_t waiting[6]     = { 0x05, 0xff, 0xfc, 0x33, 0x03, 0x06 };
            const uint8_t trigger[6]     = { 0x05, 0xff, 0xfd, 0xaa, 0x03, 0x06 };
            const uint8_t pairing[6]     = { 0x05, 0xff, 0xff, 0x33, 0x0c, 0x07 };
            const uint8_t unpairing[6]   = { 0x05, 0xff, 0xef, 0x33, 0x18, 0x08 };

            bool is_paired = false;
            int tool_index = -1;
            for (int i = 0; i < sizeof(id(paired_tools)) / sizeof(uint64_t); i++) {
              if (id(paired_tools)[i] == x.address_uint64()) {
                is_paired = true;
                tool_index = i;
                break;
              }

              if (id(paired_tools)[i] == 0) {
                break;
              }
            }
            
            bool in_pairing_mode = (id(adapter_state).state == id(adapter_state_pairing));
            bool in_unpairing_mode = (id(adapter_state).state == id(adapter_state_unpairing));

            if (!(is_paired || in_pairing_mode)) {
              return;
            }

            if ((x.get_scan_result().scan_rsp_len + x.get_scan_result().adv_data_len) < (offset + 6)) {
              if (is_paired) {
                ESP_LOGD("makita_aws", "Bluetooth advertisement from tool %i is too short:", tool_index);
                for (int i = 0; i < x.get_scan_result().scan_rsp_len + x.get_scan_result().adv_data_len; i++) {
                  ESP_LOGD("makita_aws", "%02x ", x.get_scan_result().ble_adv[i]);
                }
              }
              return;
            }
            const uint8_t* state = x.get_scan_result().ble_adv + offset;

            if (!is_paired) {
              if (memcmp(state, pairing, 6) == 0) {
                for (int i = 0; i < sizeof(id(paired_tools)) / sizeof(uint64_t); i++) {
                  if (id(paired_tools)[i] == 0) {
                    id(paired_tools)[i] = x.address_uint64();
                    id(tool_states)[i] = 0;
                    id(tool_timestamps)[i] = 0;
                    is_paired = true;
                    tool_index = i;
                    ESP_LOGD("makita_aws", "Paired %s as tool %i", x.address_str().c_str(), i);
                    break;
                  }
                }
                if (!is_paired) {
                  ESP_LOGD("makita_aws", "Paired tool list is full");
                }
              }
            }

            if (!is_paired) {
              return;
            }

            uint8_t previous_state = id(tool_states)[tool_index];
            uint8_t new_state = 0;

            if (memcmp(state, poweron, 6) == 0) {
              new_state = id(tool_state_poweron);
            } else if (memcmp(state, initialised, 6) == 0) {
              new_state = id(tool_state_initialised);
            } else if (memcmp(state, waiting, 6) == 0) {
              new_state = id(tool_state_waiting);
            } else if (memcmp(state, trigger, 6) == 0) {
              new_state = id(tool_state_trigger);
            } else if (memcmp(state, pairing, 6) == 0) {
              new_state = id(tool_state_pairing);
            } else if (memcmp(state, unpairing, 6) == 0) {
              new_state = id(tool_state_unpairing);
            } else {
              ESP_LOGD("makita_aws", "Unrecognized bluetooth advertisement from tool %i:", tool_index);
              for (int i = 0; i < x.get_scan_result().scan_rsp_len + x.get_scan_result().adv_data_len; i++) {
                ESP_LOGD("makita_aws", "%02x ", x.get_scan_result().ble_adv[i]);
              }
              return;
            }

            id(tool_states)[tool_index] = new_state;
            id(tool_timestamps)[tool_index] = esp_timer_get_time();

            if (previous_state == 0 && new_state != 0) {
              ESP_LOGD("makita_aws", "Tool %i connected", tool_index);
            }

            if (in_pairing_mode && new_state == id(tool_state_pairing)) {
              id(set_adapter_state).execute(id(adapter_state_pairing_success));
            }

            if (in_unpairing_mode && new_state == id(tool_state_unpairing)) {
              bool found = false;
              for (int i = 0; i < sizeof(id(paired_tools)) / sizeof(uint64_t); i++) {
                if (id(paired_tools)[i] == 0) {
                  break;
                }
                if (!found) {
                  if (id(paired_tools)[i] == x.address_uint64()) {
                    id(paired_tools)[i] = 0;
                    id(tool_states)[i] = 0;
                    id(tool_timestamps)[i] = 0;
                    is_paired = false;
                    tool_index = -1;
                    found = true;
                    ESP_LOGD("makita_aws", "Unpaired tool %i (%s)", i, x.address_str().c_str());
                  }
                } else{
                  id(paired_tools)[i - 1] = id(paired_tools)[i];
                  id(tool_states)[i - 1] = id(tool_states)[i];
                  id(tool_timestamps)[i - 1] = id(tool_timestamps)[i];
                }
              }
              if (found) {
                id(set_adapter_state).execute(id(adapter_state_unpairing_success));
              } else {
                ESP_LOGD("makita_aws", "The tool being unpaired (%s) was not found", x.address_str().c_str());
                return;
              }
            }

            id(process_tool_states).execute();

esphome:
  includes:
    - "<esp_timer.h>"
  on_boot:
    - sensor.template.publish:
        id: adapter_state
        state: 0
    - binary_sensor.template.publish:
        id: tool_active
        state: false
    - delay: 1s
    - lambda: !lambda |-
        id(rgb_ready) = true;
    - script.execute: set_rgb

globals:
  - id: rgb_ready
    type: bool
    restore_value: false
    initial_value: "false"
  - id: paired_tools
    type: uint64_t[50]
    restore_value: true
  - id: tool_states
    type: uint8_t[50]
    restore_value: false
  - id: tool_timestamps
    type: int64_t[50]
    restore_value: false

  - id: adapter_state_default
    type: "const uint8_t"
    initial_value: "0"
  - id: adapter_state_pairing
    type: "const uint8_t"
    initial_value: "1"
  - id: adapter_state_pairing_success
    type: "const uint8_t"
    initial_value: "2"
  - id: adapter_state_unpairing
    type: "const uint8_t"
    initial_value: "3"
  - id: adapter_state_unpairing_success
    type: "const uint8_t"
    initial_value: "4"
  - id: adapter_state_erase_warning
    type: "const uint8_t"
    initial_value: "5"
  - id: adapter_state_erase_success
    type: "const uint8_t"
    initial_value: "6"

  - id: tool_state_poweron
    type: "const uint8_t"
    initial_value: "1"
  - id: tool_state_initialised
    type: "const uint8_t"
    initial_value: "2"
  - id: tool_state_waiting
    type: "const uint8_t"
    initial_value: "3"
  - id: tool_state_trigger
    type: "const uint8_t"
    initial_value: "4"
  - id: tool_state_pairing
    type: "const uint8_t"
    initial_value: "5"
  - id: tool_state_unpairing
    type: "const uint8_t"
    initial_value: "6"

script:
  - id: process_tool_states
    mode: restart
    then:
      - lambda: |-
          bool active = false;
          for (int i = 0; i < sizeof(id(paired_tools)) / sizeof(uint64_t); i++) {
            if (id(paired_tools)[i] == 0) {
              break;
            }
            if (id(tool_states)[i] == id(tool_state_trigger)) {
              ESP_LOGD("makita_aws", "Tool %i is active", i);
              active = true;
            }
          }
          id(tool_active).publish_state(active);

  - id: evaluate_tool_timeouts
    mode: restart
    then:
      - lambda: |-
          int64_t now = esp_timer_get_time();
          bool needs_update = false;
          for (int i = 0; i < sizeof(id(paired_tools)) / sizeof(uint64_t); i++) {
            if (id(paired_tools)[i] == 0) {
              break;
            }
            if (id(tool_states)[i] == 0) {
              break;
            }

            if (2 * 1000 * 1000 < (now - id(tool_timestamps)[i])) {
              ESP_LOGD("makita_aws", "Tool %i disconnected", i);
              id(tool_states)[i] = 0;
              id(tool_timestamps)[i] = 0;
              needs_update = true;
            }
          }

          if (needs_update) {
            id(process_tool_states).execute();
          }

  - id: erase_all_tools
    mode: restart
    then:
      - lambda: |-
          int count = 0;
          for (int i = 0; i < sizeof(id(paired_tools)) / sizeof(uint64_t); i++) {
            if (id(paired_tools)[i] != 0) {
              count++;
            }

            id(paired_tools)[i] = 0;
            id(tool_states)[i] = 0;
            id(tool_timestamps)[i] = 0;
          }

          ESP_LOGD("makita_aws", "Unpaired %i tools", count);

          id(set_adapter_state).execute(id(adapter_state_erase_success));
          id(process_tool_states).execute();

  - id: set_rgb
    mode: queued
    then:
      - if:
          condition:
            lambda: "return id(rgb_ready);"
          then:
            - if:
                condition:
                  lambda: "return id(adapter_state).state == id(adapter_state_default);"
                then:
                  - if:
                      condition:
                        lambda: "return id(relay).state;"
                      then:
                        - light.turn_on:
                            id: rgb_light1
                            brightness: 100%
                            red: 0%
                            green: 54.9%
                            blue: 58.4%
                            effect: none
                      else:
                        # - light.turn_off: rgb_light1
                        - light.turn_on:
                            id: rgb_light1
                            brightness: 40%
                            red: 0%
                            green: 54.9%
                            blue: 58.4%
                            effect: none
            - if:
                condition:
                  lambda: "return id(adapter_state).state == id(adapter_state_pairing);"
                then:
                  - light.turn_on:
                      id: rgb_light1
                      brightness: 50%
                      red: 0%
                      green: 100%
                      blue: 0%
                      effect: none
                  - light.turn_on:
                      id: rgb_light1
                      brightness: 100%
                      effect: pairing_spin
            - if:
                condition:
                  lambda: "return id(adapter_state).state == id(adapter_state_unpairing);"
                then:
                  - light.turn_on:
                      id: rgb_light1
                      brightness: 50%
                      red: 100%
                      green: 0%
                      blue: 0%
                      effect: none
                  - light.turn_on:
                      id: rgb_light1
                      brightness: 100%
                      effect: unpairing_spin
            - if:
                condition:
                  lambda: "return id(adapter_state).state == id(adapter_state_pairing_success);"
                then:
                  - light.turn_on:
                      id: rgb_light1
                      brightness: 100%
                      red: 0%
                      green: 100%
                      blue: 0%
                      effect: none
            - if:
                condition:
                  lambda: |-
                    return id(adapter_state).state == id(adapter_state_unpairing_success)
                      || id(adapter_state).state == id(adapter_state_erase_success);
                then:
                  - light.turn_on:
                      id: rgb_light1
                      brightness: 100%
                      red: 100%
                      green: 0%
                      blue: 0%
                      effect: none
            - if:
                condition:
                  lambda: "return id(adapter_state).state == id(adapter_state_erase_warning);"
                then:
                  - light.turn_on:
                      id: rgb_light1
                      brightness: 100%
                      effect: erase_warning

  - id: set_adapter_state
    mode: restart
    parameters:
      state: int
    then:
      - sensor.template.publish:
          id: adapter_state
          state: !lambda return state;
      - if:
          condition:
            lambda: |-
              return state == id(adapter_state_pairing)
                || state == id(adapter_state_unpairing)
                || state == id(adapter_state_erase_warning);
          then:
            - delay: 20s
            - sensor.template.publish:
                id: adapter_state
                state: !lambda return id(adapter_state_default);
      - if:
          condition:
            lambda: |-
              return state == id(adapter_state_pairing_success)
                || state == id(adapter_state_unpairing_success)
                || state == id(adapter_state_erase_success);
          then:
            - delay: 2s
            - sensor.template.publish:
                id: adapter_state
                state: !lambda return id(adapter_state_default);

interval:
  - interval: 200ms
    then:
      - script.execute: evaluate_tool_timeouts

binary_sensor:
  - platform: template
    name: "Tool active"
    id: tool_active
    on_state:
      then:
        - if:
            condition:
              lambda: 'return id(tool_active).state;'
            then:
              - switch.turn_on: relay
            else:
              - switch.turn_off: relay
              
  - platform: gpio
    id: "push_button"
    name: "Button"
    internal: true
    pin:
      number: GPIO18
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 5ms
    on_multi_click:
      - timing: [ON for at least 3s]
        then:
          - if:
              condition:
                # Prevent running on second click
                lambda: 'return id(adapter_state).state != id(adapter_state_unpairing);'
              then:
                - script.execute:
                    id: set_adapter_state
                    state: !lambda return id(adapter_state_pairing);
      - timing: [ON for at least 6s]
        then:
          - script.execute:
              id: set_adapter_state
              state: !lambda return id(adapter_state_unpairing);
      - timing:
          - ON for at least 6s
          - OFF for at most 3s
          - ON for at least 6s
        then:
          - script.execute:
              id: set_adapter_state
              state: !lambda return id(adapter_state_erase_warning);
      - timing:
          - ON for at least 6s
          - OFF for at most 3s
          - ON for 6s to 9s
          - OFF for at least 100ms
        then:
          - script.execute:
              id: erase_all_tools
      - timing:
          - ON for at least 6s
          - OFF for at most 3s
          - ON for at least 9s
        then:
          - if:
              condition:
                lambda: 'return id(adapter_state).state == id(adapter_state_erase_warning);'
              then:
                - script.execute:
                    id: set_adapter_state
                    state: !lambda return id(adapter_state_default);

switch:
  - platform: gpio
    id: relay
    pin: GPIO4
    name: "Relay"
    restore_mode: ALWAYS_OFF
    on_state:
      - script.execute: set_rgb

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    chipset: ws2812
    pin: GPIO5
    num_leds: 4
    id: rgb_light1
    internal: false
    default_transition_length: 0ms
    restore_mode: ALWAYS_OFF
    effects:
      - addressable_color_wipe:
          name: pairing_spin
          colors:
            - red: 0%
              green: 100%
              blue: 0%
              num_leds: 1
            - red: 0%
              green: 50%
              blue: 0%
              num_leds: 3
          add_led_interval: 100ms
          reverse: false
      - addressable_color_wipe:
          name: unpairing_spin
          colors:
            - red: 100%
              green: 0%
              blue: 0%
              num_leds: 1
            - red: 50%
              green: 0%
              blue: 0%
              num_leds: 3
          add_led_interval: 100ms
          reverse: false
      - strobe:
          name: erase_warning
          colors:
            - state: true
              red: 100%
              green: 0%
              blue: 0%
              duration: 100ms
            - state: false
              duration: 100ms
uart:
  id: uart_0
  tx_pin: GPIO7
  rx_pin: 
    number: GPIO6
    mode:
      pullup: true
      input: true
  baud_rate: 9600
  stop_bits: 1
  data_bits: 8
  parity: NONE
  rx_full_threshold: 23
  # debug:
  #   direction: BOTH
  #   dummy_receiver: true
  #   after:
  #     delimiter: "\n"
  #   sequence:
  #     - lambda: UARTDebug::log_hex(direction, bytes, 32);

sensor:
  - platform: template
    name: "Adapter state"
    id: adapter_state
    on_value:
      then:
        - script.execute: set_rgb
  - platform: ntc
    sensor: temp_resistance_reading
    name: "Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: "mdi:thermometer"
    calibration:
      b_constant: 3350
      reference_resistance: 10kOhm
      reference_temperature: 298.15K
    on_value_range:
      - above: ${max_temp}
        then:
          - switch.turn_off: "relay"
  - platform: resistance
    id: temp_resistance_reading
    sensor: temp_analog_reading
    configuration: DOWNSTREAM
    resistor: 10kOhm
  - platform: adc
    id: temp_analog_reading
    pin: GPIO3
    attenuation: 12db

  - platform: bl0942
    uart_id: uart_0
    address: 0
    voltage:
      name: "Voltage"
      id: bvoltage
      icon: mdi:alpha-v-circle-outline
      device_class: voltage
    current:
      name: "Current"
      id: bcurrent
      icon: mdi:alpha-a-circle-outline
      device_class: current
    power:
      name: "Power"
      id: bpower
      icon: mdi:transmission-tower
      device_class: power
    energy:
      name: "Energy"
      id: benergy
      icon: mdi:lightning-bolt
      device_class: energy
    frequency:
      name: "Frequency"
      id: bfreq
      accuracy_decimals: 2
      icon: mdi:cosine-wave
      device_class: frequency
    update_interval: ${update_bl0942}
